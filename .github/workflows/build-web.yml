name: build-web

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/build-web.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@1e60f620b9541d3f1a3c8f0f2f9a9a6c2f7d4c7e # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        run: npm ci --prefix web
      - name: Build dashboard and Get Started bundles
        run: npm --prefix web run build
      - name: Commit refreshed static bundles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard/app.js dashboard/start.js dashboard/*.LEGAL.txt
          if git diff --cached --quiet; then
            echo "Generated bundles are already up to date."
          else
            git commit -m "build: refresh website bundles"
            git push
          fi
