name: build-package-artifacts

on:
  push:
    branches: [main]
    paths:
      - "pyproject.toml"
      - "agentshield/**"
      - "provenant/**"
      - "scripts/build_release.py"
      - ".github/workflows/build-package-artifacts.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.13"
      - name: Build distribution and refresh installer assets
        run: |
          python -m pip install build
          python scripts/build_release.py --publish-site
      - name: Commit generated package assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist dashboard/download install.ps1
          if git diff --cached --quiet; then
            echo "Package assets are already current."
          else
            git commit -m "build: refresh package artifacts and installer metadata"
            git push
          fi
